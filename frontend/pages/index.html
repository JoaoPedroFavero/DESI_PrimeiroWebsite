<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
</head>

<!-- 
Objetivo e desafio
Chegou a hora de colocar tudo o que vimos até agora em prática: vocês vão criar o primeiro site completo de vocês, usando apenas HTML e CSS (ainda sem JavaScript). O desafio é criar um site de vendas — o tema é livre, desde que o site esteja vendendo algo, seja um produto, um serviço, ou até algo fictício e inventado por vocês. Vocês escolhem o produto, a paleta de cores, a tipografia e o estilo visual, sem restrições. A ideia é que vocês pratiquem estrutura semântica, layout com Flexbox e Grid, e construam uma identidade visual própria — do zero até um site que pareça de verdade.

 
Requisitos mínimos
O site deve ter no mínimo 3 páginas:
Uma página inicial (produtos); grid
Uma página com mais informações, descrição, etc, do produto; landing page
Uma página de contato, com um formulário.
Header e footer devem ser iguais em todas as páginas (mesma navegação, mesmo rodapé);
A navegação entre as páginas deve funcionar de verdade;
Organização de arquivos (estrutura de pastas já ensinada em outras aulas (Ex.: fronted/pages/index.html).
 
Tags obrigatórias
Estrutura semântica:

<header>, <nav>, <main>, <footer>;
<section> - para separar blocos de conteúdo;
<h1> - respeitando hierarquia de títulos.
Conteúdo e mídia:

<img> com atributo alt preenchido corretamente;
<a> com href relativo (navegação entre páginas);
<ul> ou <ol> com <li>.
Formulário (página de contato):

<form>, <label>, <input> (variando o type), <textarea>, <button>
Uso dos atributos required e placeholder
Uso de <div> e <span>: permitido, mas use com critério — prefira uma tag semântica sempre que ela se encaixar.

 
Uso de Inteligência Artificial
Liberado, desde que seja para aprender (tirar dúvida, entender um conceito, pedir sugestão) — não para simplesmente copiar e colar código pronto sem entender o que ele faz.

 
Dicas
Para ajudar na parte visual, aqui vão duas ferramentas que podem ser úteis:

Paleta de Cores — gerador de paletas de cores.
Dribbble — galeria com exemplos de sites e telas feitos por designers. Vale usar para se inspirar em layout, cores e estilo, mas lembrem-se: inspirar-se é diferente de copiar.
-->

<body>
    <header>
        <div class="Logo">LOGO</div>

        <nav>
            <a href="/pages/form.html">Formulário</a>
        </nav>

        <input type="text" placeholder="Pesquise aqui">
    </header>

    <main>
        <div class="banner">
            <img src="https://i.redd.it/5isxex9k0h551.jpg"
                alt="Star Wars Banner">
        </div>

        <div class="bestsellers">
            <h1>BESTSELLERS</h1>
        </div>

        <section class="produtos">
            <div class="produto-1">
                <div class="image-book">
                    <img src="https://www.comix.com.br/media/catalog/product/cache/368852526d07b47f9ba19ccfaea17e2a/d/a/dartmal.capa.png" alt="STAR WARS DARTH MAUL">
                </div>
                <div class="title-btn">
                    <h1>Star Wars: Darth Maul</h1>
                    <button>VER MAIS</button>
                </div>
            </div>

            <div class="produto-2">
                <div class="image-book">
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRPRNA2GURahA5CayOIUOrGzR5yz53l9rj3jZjtgAr_pLXHqBkO9OYlI8Mk&s=10" alt="Star Wars: Uma Nova Esperança">
                </div>
                <div class="title-btn">
                    <h1>Star Wars: Uma Nova Esperança</h1>
                    <button>VER MAIS</button>
                </div>
            </div>

            <div class="produto-3">
                <div class="image-book">
                    <img src="https://www.comix.com.br/media/catalog/product/cache/368852526d07b47f9ba19ccfaea17e2a/l/e/legends-stwr.capa.panini_1_.png" alt="Star Wars: A Guerra nas Estrelas">
                </div>
                <div class="title-btn">
                    <h1>Star Wars: A Guerra nas Estrelas</h1>
                    <button>VER MAIS</button>
                </div>
            </div>

            <div class="produto-4">
                <div class="image-book">
                    <img src="https://a-static.mlcdn.com.br/%7Bw%7Dx%7Bh%7D/hq-star-wars-darth-vader-capa-dura-editora-panini/magazineluiza/236834400/e07202cab2a2afa072e43b69ed9feb07.jpg" alt="Star Wars: Darth Vader" height="200px">
                </div>
                <div class="title-btn">
                    <h1>Star Wars: Darth Vader</h1>
                    <button>VER MAIS</button>
                </div>
            </div>
        </section>
    </main>
    
    <footer>
        <p>Crédito ao Design <a href="https://dribbble.com/shots/26729768-Molfar-Bookstore-Hero-Section-Teaser" style="color: rgb(1, 155, 229); text-decoration: none;">Design de Vadim Coolin</a></p>
    </footer>

</body>

</html>
