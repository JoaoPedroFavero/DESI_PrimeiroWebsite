<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <link id="link-icone" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="/tema/tema.css">
    <script src="../../script/script.js" defer></script>
    <script src="../../script/tema.js" defer></script>
</head>

<body>
    <header>
        <div class="Logo">LOGO</div>

        <nav>
            <a href="../form/form.html">Formulário</a>
        </nav>

        <input type="text" placeholder="Pesquise aqui">
    </header>

    <main>
        <div class="banner">
            <img src="https://i.redd.it/5isxex9k0h551.jpg" alt="Star Wars Banner">
        </div>

        <div class="bestsellers">
            <h1>BESTSELLERS</h1>
        </div>

        <section class="produtos">
            <div class="produto-1">
                <div class="image-book">
                    <img src="https://www.comix.com.br/media/catalog/product/cache/368852526d07b47f9ba19ccfaea17e2a/d/a/dartmal.capa.png"
                        alt="STAR WARS DARTH MAUL">
                </div>
                <div class="title-btn">
                    <h1>Star Wars: Darth Maul</h1>
                    <button id="btn-produto-1">VER MAIS</button>
                </div>
            </div>

            <div class="produto-2">
                <div class="image-book">
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRPRNA2GURahA5CayOIUOrGzR5yz53l9rj3jZjtgAr_pLXHqBkO9OYlI8Mk&s=10"
                        alt="Star Wars: Uma Nova Esperança">
                </div>
                <div class="title-btn">
                    <h1>Star Wars: Uma Nova Esperança</h1>
                    <button id="btn-produto-2">VER MAIS</button>
                </div>
            </div>

            <div class="produto-3">
                <div class="image-book">
                    <img src="https://www.comix.com.br/media/catalog/product/cache/368852526d07b47f9ba19ccfaea17e2a/l/e/legends-stwr.capa.panini_1_.png"
                        alt="Star Wars: A Guerra nas Estrelas">
                </div>
                <div class="title-btn">
                    <h1>Star Wars: A Guerra nas Estrelas</h1>
                    <button id="btn-produto-3">VER MAIS</button>
                </div>
            </div>

            <div class="produto-4">
                <div class="image-book">
                    <img src="https://a-static.mlcdn.com.br/%7Bw%7Dx%7Bh%7D/hq-star-wars-darth-vader-capa-dura-editora-panini/magazineluiza/236834400/e07202cab2a2afa072e43b69ed9feb07.jpg"
                        alt="Star Wars: Darth Vader" height="200px">
                </div>
                <div class="title-btn">
                    <h1>Star Wars: Darth Vader</h1>
                    <button id="btn-produto-4">VER MAIS</button>
                </div>
            </div>
        </section>
    </main>

    


    <footer>
        <p>Crédito ao Design <a href="https://dribbble.com/shots/26729768-Molfar-Bookstore-Hero-Section-Teaser"
                style="color: rgb(1, 155, 229); text-decoration: none;">Design de Vadim Coolin</a></p>
        
        <button class="theme-button" id="theme-button"><span id="icone" class="material-symbols-outlined">brightness_2</span></button>
    </footer>

</body>

</html>
