<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <div class="Logo">LOGO</div>
        <nav>
            <a href="../home/index.html">Home</a>
        </nav>

        <input type="text" placeholder="Pesquise aqui">
    </header>

    <main>

        <div class="formulario-container">
            <form class="formulario">
                <div class="inputs-formulario">
                    <div class="input">
                        <label for="Nome">Nome Completo</label>
                        <input id="Nome" type="text" placeholder="Seu nome aqui...">
                    </div>

                    <div class="input">
                        <label for="Email">Email</label>
                        <input id="Email" type="email" placeholder="Seu email aqui...">
                    </div>
                </div>

                <div class="botoes-formulario">
                    <button id="limpar-btn" type="reset">Limpar</button>
                    <button id="enviar-btn" type="submit">Enviar</button>
                </div>
            </form>
        </div>

    </main>

    <footer>
        <p>Crédito ao Design <a href="https://dribbble.com/shots/26729768-Molfar-Bookstore-Hero-Section-Teaser"
                style="color: rgb(1, 155, 229); text-decoration: none;">Design de Vadim Coolin</a></p>
    </footer>
</body>

</html>
